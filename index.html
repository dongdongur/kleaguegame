<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-레전드 38</title>
<meta name="description" content="시대별 K리그 레전드 팀을 스핀해서 베스트 11을 뽑고 38라운드 시즌을 시뮬레이션하는 팬 제작 게임">
<meta property="og:title" content="K-레전드 38">
<meta property="og:description" content="K리그 레전드 베스트 11 드래프트. 38전 전승에 도전해 보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>K-레전드 <b>38</b></h1>
      <p>시대별 K리그 레전드 팀을 스핀해서 한 명씩 뽑아 베스트 11을 만들고, 20팀 38라운드 시즌을 돌려 보세요. 목표는 38전 전승이에요.</p>
    </div>
    <div class="best" id="best"></div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="setup">
        <div class="seg" id="modeSeg" role="group" aria-label="드래프트 방식"></div>
      </div>
      <div class="setup">
        <div class="seg" id="formSeg" role="group" aria-label="포메이션"></div>
        <label class="toggle"><input type="checkbox" id="hard"> 하드모드 (능력치 숨김)</label>
      </div>
      <div class="setup">
        <label class="label" for="teamName">팀 이름</label>
        <input class="teamname" id="teamName" maxlength="14" value="레전드 FC">
        <label class="label" for="nick">닉네임</label>
        <input class="teamname" id="nick" maxlength="12" placeholder="친구들에게 보일 이름">
      </div>
      <div class="pitch" id="pitch">
        <svg class="lines" viewBox="0 0 68 88" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".35">
            <rect x="2" y="2" width="64" height="84"/>
            <line x1="2" y1="44" x2="66" y2="44"/>
            <circle cx="34" cy="44" r="7.5"/>
            <rect x="15" y="2" width="38" height="14"/><rect x="25" y="2" width="18" height="5"/>
            <rect x="15" y="72" width="38" height="14"/><rect x="25" y="81" width="18" height="5"/>
          </g>
        </svg>
      </div>
      <div class="mgr" id="mgrBox"></div>
      <div class="pitchfoot">
        <span>공격 <b id="attV">–</b></span><span>수비 <b id="defV">–</b></span><span>케미 <b id="chemV">+0.0</b></span><span>선발 <b id="cntV">0/11</b></span>
      </div>
    </div>

    <div class="panel" id="desk">
      <div class="label">드래프트</div>
      <div class="reel" id="reel" aria-live="polite">
        <div class="club" id="reelClub">스핀을 눌러 시작</div>
        <div class="eraL" id="reelEra">29개 시대별 레전드 팀</div>
      </div>
      <div class="btnrow">
        <button class="btn primary" id="spinBtn" type="button">스핀</button>
        <button class="btn ghost" id="mgrBtn" type="button">감독 뽑기</button>
        <button class="btn ghost" id="respinBtn" type="button" disabled>다시 스핀 (2)</button>
        <button class="btn" id="simBtn" type="button" disabled>시즌 시뮬레이션</button>
      </div>
      <p class="hint" id="hint"></p>
      <ul class="plist" id="plist"></ul>
      <div class="progress" id="progress" aria-hidden="true"></div>
    </div>
  </div>

  <div id="results" hidden></div>

  <section class="panel" id="sharedWrap" hidden style="margin-top:26px">
    <div class="setup" style="justify-content:space-between">
      <h2 style="margin:0">친구들 기록</h2>
      <div class="seg" id="sharedSort" role="group" aria-label="정렬"></div>
    </div>
    <div id="shared"></div>
  </section>

  <footer>
    비공식 팬 제작 게임이에요. K리그와 각 구단, 선수와는 관련이 없어요. 능력치는 해당 시기 활약을 기준으로 한 주관적 평가이고, 시대별 명단은 대표 선수 위주로 구성해서 실제 등록 명단과 다를 수 있어요. 엠블럼과 공식 이미지는 사용하지 않았어요.
  </footer>
</div>

<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/game.js"></script>
<script src="js/share.js"></script>
</body>
</html>
