<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>패치노트 · K-레전드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg0:#05070f;--panel:#0e1631;--panel2:#142046;--line:rgba(120,150,255,.18);--txt:#eaf0ff;--muted:#8d9bc4;--acc:#19f2a3;--acc2:#27d7ff;--gold:#ffcf4a;
 --f-head:"Black Han Sans","Noto Sans KR",sans-serif;--f-num:"Oswald","Noto Sans KR",sans-serif;--f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;background:radial-gradient(900px 520px at 85% -8%,rgba(60,90,255,.28),transparent 60%),linear-gradient(180deg,#070c1c,#05070f 40%);background-attachment:fixed;color:var(--txt);font:15px/1.6 var(--f-body);display:flex;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{width:100%;max-width:640px;padding:20px 16px 48px;display:grid;gap:14px;align-content:start}
.top{display:flex;align-items:center;gap:10px}
.back{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font-size:18px;display:grid;place-items:center;text-decoration:none}
h1{font:400 26px var(--f-head)}h1 small{display:block;font:600 11px var(--f-num);letter-spacing:.16em;color:var(--acc)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font:600 13.5px var(--f-body);cursor:pointer}
.filters button.on{background:linear-gradient(90deg,var(--acc),#12c987);color:#04281b;border-color:transparent}
.ver{border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,var(--panel2),var(--panel));overflow:hidden}
.ver summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:14px 16px;min-height:60px}
.ver summary::-webkit-details-marker{display:none}
.vn{font:700 22px var(--f-num);color:var(--gold)}
.vt b{display:block;font-size:15.5px}.vt small{color:var(--muted);font-size:12.5px}
.chev{color:var(--muted);transition:transform .2s}.ver[open] .chev{transform:rotate(90deg)}
.new{font:700 10.5px var(--f-num);letter-spacing:.1em;padding:2px 7px;border-radius:999px;background:#ff4d6d;color:#fff;margin-left:6px;vertical-align:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.tag{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line)}
.tag.p{color:var(--acc2);border-color:rgba(39,215,255,.4)}.tag.m{color:var(--acc);border-color:rgba(25,242,163,.4)}.tag.c{color:var(--gold);border-color:rgba(255,207,74,.4)}
.items{display:grid;gap:8px;padding:4px 16px 16px}
.it{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:14px}
.it b{color:var(--acc);font-size:12.5px;padding-top:2px}
.foot{color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="top"><a class="back" href="index.html" aria-label="메인으로">‹</a><h1><small>PATCH NOTES</small>패치노트</h1></div>
  <p class="foot" style="text-align:left">그동안 바뀐 중요한 내용을 버전별로 모았어요. 최신 버전이 위에 있고, 눌러서 펼쳐 볼 수 있어요.</p>
  <div class="filters" id="flt"></div>
  <div id="list"></div>
  <p class="foot">비영리 팬 프로젝트 · 새 업데이트가 나올 때마다 여기에 추가돼요.</p>
</main>
<script src="js/patchnotes.js"></script>
<script>
(function(){
  var P=window.KL_PATCH||[]; var cur="all", seen=null; try{ seen=localStorage.getItem("kl-patch-seen"); }catch(e){}
  var esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var cls={"선수판":"p","감독판":"m","공통":"c"};
  function cmp(a,b){ var x=a.split(".").map(Number), y=b.split(".").map(Number); for(var i=0;i<Math.max(x.length,y.length);i++){ var d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; }
  function render(){
    var list=P.filter(function(v){ return cur==="all"||v.tags.indexOf(cur)>=0; });
    document.getElementById("list").innerHTML=list.map(function(v,i){
      var isNew=!seen||cmp(v.v,seen)>0;
      return '<details class="ver"'+(i===0?" open":"")+'><summary><span class="vn">v'+esc(v.v)+'</span><span class="vt"><b>'+esc(v.title)+(isNew?'<span class="new">NEW</span>':'')+'</b><small>'+esc(v.date)+'</small></span><span class="chev">›</span></summary><div class="tags">'+v.tags.map(function(t){ return '<span class="tag '+(cls[t]||"c")+'">'+esc(t)+'</span>'; }).join("")+'</div><div class="items">'+v.items.map(function(it){ return '<div class="it"><b>'+esc(it[0])+'</b><span>'+esc(it[1])+'</span></div>'; }).join("")+'</div></details>';
    }).join("")||'<p class="foot">해당하는 패치가 없어요.</p>';
  }
  var f=document.getElementById("flt"); f.innerHTML=["all","선수판","감독판","공통"].map(function(t){ return '<button type="button" data-t="'+t+'" class="'+(t===cur?"on":"")+'">'+(t==="all"?"전체":t)+'</button>'; }).join("");
  f.addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; cur=b.getAttribute("data-t"); [].forEach.call(f.children,function(x){ x.className=x===b?"on":""; }); render(); });
  render();
  try{ localStorage.setItem("kl-patch-seen",window.KL_PATCH_LATEST); }catch(e){}
})();
</script>
</body>
</html>
